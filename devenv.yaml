# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  ifiokjr-nixpkgs:
    # Carries monochange 0.16.0; mdt stays at 0.9.5.
    url: github:ifiokjr/nixpkgs/cc53d342fbe353e2918b4216ea853f6bd6d10655
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
allowUnfree: true
