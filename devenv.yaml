# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  ifiokjr-nixpkgs:
    # Carries monochange 0.20.0 and mdt 0.9.6.
    url: github:ifiokjr/nixpkgs/3c2b86c5e0c46968e76295cc6b414194d8a7a61f
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
allowUnfree: true
