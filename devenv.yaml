# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  ifiokjr-nixpkgs:
    # Carries monochange 0.20.1 and mdt 0.9.6.
    url: github:ifiokjr/nixpkgs/3bff487ba391c27ef479d1f02c4b93d0c35bcedf
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
allowUnfree: true
