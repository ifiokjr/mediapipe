# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  ifiokjr-nixpkgs:
    # Carries monochange 0.19.0 and mdt 0.9.6.
    url: github:ifiokjr/nixpkgs/51b4974089ae9343277257a4828a47d538964eb0
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
allowUnfree: true
