name: Publish

# Publishes the dart packages of a release to pub.dev with trusted publishing
# (OIDC). pub.dev only accepts automated publishing from workflow runs whose
# ref is the release tag (`refs/tags/<tag-pattern>`); it rejects every token
# minted from a branch ref, for push and workflow_dispatch events alike (the
# "Enable publishing from `workflow_dispatch` events" option on pub.dev only
# relaxes the event name; the tag-ref requirement stays).
#
# The release flow is:
#   1. release-pr.yml pushes the release tag with a PAT so the `push` trigger
#      below fires a run on the tag ref, then creates the draft release.
#   2. The first run publishes the first batch of at most four packages (the
#      pub.dev publish rate limit) in dependency order.
#   3. The scheduled drain dispatches the next batch on the same tag ref until
#      every package of the release is published, then publishes (un-drafts)
#      the GitHub release.
#
# Manual retries must be dispatched ON the release tag ref:
#
#   gh workflow run publish.yml --ref v0.1.0
#
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to resume; defaults to the oldest draft release
        required: false
        type: string
  schedule:
    # The drain dispatches only while a draft release is waiting, so the
    # schedule stays quiet between releases.
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: publish-pub-dev
  cancel-in-progress: false

jobs:
  drain:
    name: Dispatch the next publishing batch
    if: github.repository == 'ifiokjr/mediapipe' && github.event_name == 'schedule'
    permissions:
      actions: write # Dispatch the OIDC-eligible workflow_dispatch run.
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch publishing on the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+([+-].*)?$")))] | sort_by(.created_at) | .[0].tag_name'
          )"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No draft package release is waiting to be published."
            exit 0
          fi
          # pub.dev trusted publishing validates the run ref, so the batch is
          # dispatched ON the release tag instead of a branch.
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$tag" \
            --field "tag=$tag"
        shell: bash

  publish:
    if: github.repository == 'ifiokjr/mediapipe' && github.event_name != 'schedule'
    environment: publisher
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '[.[] | select(.draft == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+([+-].*)?$")))] | sort_by(.created_at) | .[0].tag_name'
            )"
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "No draft package release is waiting to be published."
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing unexpected release tag '$tag'."
            exit 1
          fi

          # pub.dev rejects every token minted from a branch ref, so a run
          # that is not on the release tag cannot publish anything. Fail with
          # instructions instead of un-drafting a partially published release.
          if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "::error::This run ref is $GITHUB_REF, not refs/tags/$tag. pub.dev trusted publishing only accepts runs on the release tag. Dispatch the publish on the tag instead: gh workflow run publish.yml --ref $tag"
            exit 1
          fi

          {
            echo "present=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Wait for the draft release
        if: steps.release.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # The release-pr tag job pushes the tag (starting this run) and then
          # creates the draft release. Wait for the draft before publishing.
          for attempt in $(seq 1 40); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Draft release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/40: release not found yet; sleeping 15s"
            sleep 15
          done
          echo "::error::Draft release $RELEASE_TAG was not created within the wait window. Check the release-pr tag job." >&2
          exit 1
        shell: bash

      - name: Check out release tag
        if: steps.release.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit
        if: steps.release.outputs.present == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main --tags
          tag_commit="$(git rev-list -n1 "$RELEASE_TAG")"
          if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
            echo "::error::The checkout does not match $RELEASE_TAG."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::$RELEASE_TAG is not reachable from main."
            exit 1
          fi
        shell: bash

      - name: Set up Dart trusted publishing
        if: steps.release.outputs.present == 'true'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Set up toolchains
        if: steps.release.outputs.present == 'true'
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select the next pub.dev batch
        if: steps.release.outputs.present == 'true'
        id: batch
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: repo-dart run tool/plan_pub_batch.dart --version "$RELEASE_VERSION"
        shell: devenv shell -- bash -e {0}

      - name: Check publish readiness
        if: steps.batch.outputs.count != '0'
        env:
          PACKAGE_IDS: ${{ steps.batch.outputs.packages }}
        run: |
          set -euo pipefail
          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGE_IDS")
          monochange step publish-readiness \
            --from HEAD \
            --output "$RUNNER_TEMP/publish-readiness.json" \
            --format json \
            "${package_args[@]}"
        shell: devenv shell -- bash -e {0}

      - name: Publish package batch
        if: steps.batch.outputs.count != '0'
        env:
          PACKAGE_IDS: ${{ steps.batch.outputs.packages }}
        run: |
          set -euo pipefail
          package_args=()
          while IFS= read -r package; do
            package_args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGE_IDS")
          monochange step publish-packages \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json \
            "${package_args[@]}"
        shell: devenv shell -- bash -e {0}

      - name: Publish the GitHub release
        # GitHub Actions coerces an empty step output to the number 0 in
        # comparisons, so this step must never rely on `count == '0'` alone:
        # gate it on the release being present, otherwise a run without a
        # draft release would still run `devenv` without a toolchain.
        if: >-
          steps.release.outputs.present == 'true' &&
          (steps.batch.outputs.count == '0' || steps.batch.outputs.final == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange step publish-release --from-ref HEAD --format json
        shell: devenv shell -- bash -e {0}

      - name: Upload MonoChange reports
        if: always() && steps.release.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monochange-publish-${{ steps.release.outputs.tag }}
          path: |
            ${{ runner.temp }}/publish-readiness.json
            ${{ runner.temp }}/publish-result.json
          if-no-files-found: ignore
          retention-days: 14
