name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ifiokjr/mediapipe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      is_release_commit: ${{ steps.release-record.outputs.is_release_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure release identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin
        shell: bash

      - name: Detect a merged release commit
        id: release-record
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if is_release_commit="$(
            monochange step release-record \
              --from HEAD \
              --format json \
              --jq '.resolved_commit == .record_commit' \
              2>"$error_file"
          )"; then
            echo "is_release_commit=$is_release_commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_body="$(git log -1 --pretty=%B)"
          if grep -q '<!-- monochange:release-record:start -->' <<<"$commit_body"; then
            echo "::error::The release record in HEAD could not be read."
            sed -n '1,120p' "$error_file" >&2
            exit 1
          fi

          echo "is_release_commit=false" >> "$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: Detect pending changesets
        id: changesets
        if: steps.release-record.outputs.is_release_commit != 'true'
        run: |
          if find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Require release PR token
        if: steps.release-record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not configured."
            exit 1
          fi
        shell: bash

      - name: Configure GitHub authentication
        if: steps.release-record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          # A repository-scoped PAT makes release-branch pushes trigger CI.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: gh auth setup-git
        shell: bash

      - name: Open or refresh the release PR
        if: steps.release-record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: monochange run release
        shell: devenv shell -- bash -e {0}

      - name: Add release PR attribution
        if: steps.release-record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list \
              --base main \
              --state open \
              --json headRefName,number \
              --jq '[.[] | select(.headRefName | startswith("chore/release"))][0].number'
          )"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "::error::MonoChange did not leave an open release PR."
            exit 1
          fi

          body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .body)"
          attribution='Created on behalf of Ifiok Jr. (@ifiokjr) with Codex (GPT-5, high reasoning).'
          if ! grep -Fq "$attribution" <<<"$body"; then
            updated_body="${body}"$'\n\n'"${attribution}"
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              --field body="$updated_body" \
              >/dev/null
          fi
        shell: bash

  tag:
    if: github.repository == 'ifiokjr/mediapipe' && needs.update.outputs.is_release_commit == 'true'
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write # Dispatch publish.yml after creating release tags.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure release identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: Configure GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
        shell: bash

      - name: Create release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange step tag-release --from HEAD --push=true --format json
        shell: devenv shell -- bash -e {0}

      - name: Create draft GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange step publish-release --from-ref HEAD --draft --format json
        shell: devenv shell -- bash -e {0}

      - name: Dispatch protected package publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_record="$RUNNER_TEMP/release-record.json"
          monochange step release-record --from HEAD --format json > "$release_record"

          mapfile -t release_tags < <(
            jq -r '.record.release_targets[] | select(.tag == true) | .tag_name' "$release_record"
          )
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "::error::The release record does not contain a publishable tag."
            exit 1
          fi

          for tag in "${release_tags[@]}"; do
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Refusing to dispatch unexpected release tag '$tag'."
              exit 1
            fi
            gh workflow run publish.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              --field "tag=$tag"
          done
        shell: devenv shell -- bash -e {0}
