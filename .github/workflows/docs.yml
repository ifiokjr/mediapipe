name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/devenv/**"
      - "devenv.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0 # v6
        with:
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0 # v6

      - name: Build documentation
        run: docs:build
        shell: devenv shell bash -- -e {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0 # v5
        with:
          path: docs/build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1 # v5
