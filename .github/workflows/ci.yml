name: CI

on:
  push:
    branches: [main]
  # Pull requests run against any base so every layer of a stacked set of
  # pull requests is verified, not only the one currently targeting main.
  pull_request:
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ifiokjr/monostyle@ab5d8d2f6af6ea12d5655a11ab61b92c2365ddfe # v0.3.27
        if: always()
        with:
          version: 0.3.27

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repository history for secrets
        run: gitleaks git --redact --no-banner --exit-code 1

      - name: Run lint suite
        run: lint:all

      - name: Verify changeset coverage
        # Generated release PRs consume their source changesets before CI runs.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          changed_path_args=()
          while IFS= read -r -d '' path; do
            changed_path_args+=(--changed-paths "$path")
          done < <(git diff --name-only -z "$BASE_SHA"...HEAD)

          label_args=()
          while IFS= read -r label; do
            label_args+=(--label "$label")
          done < <(jq -r '.[]' <<< "$PR_LABELS_JSON")

          if (( ${#changed_path_args[@]} > 0 )); then
            monochange step affected-packages \
              "${changed_path_args[@]}" \
              "${label_args[@]}" \
              --verify
          fi

      - name: Run unit tests
        run: test:unit

      - name: Build browser examples and run browser integration
        run: test:web

      - name: Build documentation
        run: docs:build

      - name: Verify documentation links
        run: docs:links

      - name: Validate package archives
        run: package:check

      - name: Verify release preview
        # Generated release PRs contain the prepared release record after their
        # source changesets have been consumed.
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'release')
        run: |
          set -euo pipefail
          # `monochange preview` errors when no changesets are pending, which is
          # the normal state of main right after a release merge and of pull
          # requests that touch no publishable package.
          if find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            monochange preview --format md
          else
            echo "No changesets are pending; skipping the release preview."
          fi
        shell: devenv shell -- bash -e {0}

  coverage:
    # Every changed production line must execute under the unit-test lanes.
    # Browser-only and native-runtime files are excluded inside the tool.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect line coverage
        run: coverage:collect

      - name: Verify patch coverage
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: coverage:check --base "$BASE_SHA" --summary "$GITHUB_STEP_SUMMARY"

  perf:
    # Runs the hot-path benchmarks at the base commit and at this commit on the
    # same runner, then fails on median regressions beyond the tolerance. Both
    # runs sharing one machine cancels out runner-to-runner speed differences.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Benchmark the base commit
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          mkdir -p /tmp/mp-bench
          bench:baseline "$BASE_SHA" /tmp/mp-bench/base.json

      - name: Benchmark this commit
        run: bench:run --rounds 2 --json /tmp/mp-bench/head.json

      - name: Compare against the base commit
        run: |
          bench:compare --base /tmp/mp-bench/base.json --head /tmp/mp-bench/head.json \
            --summary "$GITHUB_STEP_SUMMARY"

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd docs
          dart pub get

      - name: Analyze packages
        run: dart analyze --fatal-infos packages

      - name: Run unit tests
        run: dart run melos exec --dir-exists=test --fail-fast --concurrency=1 -- flutter test test

  mobile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6.3.0

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Kotlin
        run: lint:kotlin
        shell: devenv shell bash -- -e {0}

      - name: Build Android plugin fixture
        run: test:android-build
        shell: devenv shell bash -- -e {0}

  mobile-ios:
    # MediaPipeTasksCommon 1.0 references Metal residency APIs from the iOS 18
    # SDK. macOS 15 provides Xcode 16.4 and that SDK on hosted runners.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Swift
        run: lint:swift
        shell: devenv shell bash -- -e {0}

      - name: Build iOS plugin fixture
        run: test:ios-build
        shell: devenv shell bash -- -e {0}

  native-macos:
    # OpenCV 3.4's ARM feature probes fail with the macOS 14 runner's older
    # SDK/toolchain combination. This matches the runner used to publish the
    # macOS ARM native artifact.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the classic native runtime
        run: native:build
        shell: devenv shell bash -- -e {0}

      - name: Verify native artifact manifest
        run: |
          set -euo pipefail
          test -f .mp-sdk/macos-arm64/manifest.json
          jq -e '.mediaPipeVersion == "v1.0.0" and (.libraries | length > 1)' \
            .mp-sdk/macos-arm64/manifest.json
          native:verify --target macos-arm64
          otool -L .mp-sdk/macos-arm64/libmediapipe.dylib
        shell: devenv shell bash -- -e {0}

      - name: Run native model integration
        run: test:native
        shell: devenv shell bash -- -e {0}

      - name: Run examples against the built runtime
        # The examples download digest-pinned models and run real inference
        # through the same C runtime this job just built.
        run: test:examples
        shell: devenv shell bash -- -e {0}

  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the classic native runtime
        run: native:build
        shell: devenv shell bash -- -e {0}

      - name: Verify native artifact manifest
        run: |
          set -euo pipefail
          test -f .mp-sdk/linux-x64/manifest.json
          jq -e '.mediaPipeVersion == "v1.0.0" and (.libraries | length > 1)' \
            .mp-sdk/linux-x64/manifest.json
          native:verify --target linux-x64
          ldd .mp-sdk/linux-x64/libmediapipe.so
        shell: devenv shell bash -- -e {0}

      - name: Run native model integration
        run: test:native
        shell: devenv shell bash -- -e {0}

      - name: Run examples against the built runtime
        # The examples download digest-pinned models and run real inference
        # through the same C runtime this job just built.
        run: test:examples
        shell: devenv shell bash -- -e {0}

  native-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$android_sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Build the Android ARM64 runtime
        run: native:build --target android-arm64
        shell: devenv shell bash -- -e {0}

      - name: Verify native artifact manifest and ABI
        run: |
          set -euo pipefail
          test -f .mp-sdk/android-arm64/manifest.json
          jq -e '.mediaPipeVersion == "v1.0.0" and (.libraries | length > 1)' \
            .mp-sdk/android-arm64/manifest.json
          native:verify --target android-arm64
        shell: devenv shell bash -- -e {0}

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflow permissions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: ".github/workflows/ .github/actions/"
          advanced-security: true
