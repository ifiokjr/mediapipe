name: MediaPipeTasksC
description: Generated bindings for the pinned MediaPipe Tasks C API.
output: lib/src/native/bindings.g.dart
headers:
  entry-points:
    - ../../.dart_tool/ffigen/mediapipe_tasks.h
compiler-opts:
  - -x
  - c
  - -std=c17
  - -I.dart_tool/ffigen/include
  - -isysroot
  - /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
  - -I/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include/c++/v1
functions:
  include:
    - "^Mp.*"
structs:
  include:
    - "^Mp.*"
enums:
  include:
    - "^Mp.*"
typedefs:
  include:
    - "^Mp.*"
    - "^ImageEmbedder.*"
exclude-all-by-default: true
silence-enum-warning: true
ffi-native:
  asset-id: package:mp_core/native.dart
comments:
  style: any
  length: full
