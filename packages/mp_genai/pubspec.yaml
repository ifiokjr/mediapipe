name: mp_genai
description: MediaPipe generative AI APIs for Flutter with Web and Android backends.
version: 0.0.0
repository: https://github.com/ifiokjr/mediapipe/tree/main/packages/mp_genai
issue_tracker: https://github.com/ifiokjr/mediapipe/issues
homepage: https://ifiokjr.github.io/mediapipe/packages/genai/
topics:
  - mediapipe
  - generative-ai
  - large-language-models
  - flutter

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  mp_core: ^0.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.26.3

flutter:
  plugin:
    platforms:
      android:
        package: dev.ifiokjr.mpgenai
        pluginClass: MpGenAiPlugin
